# Публикация дашборда на GitHub Pages.
# Положить в репозиторий по пути: .github/workflows/pages.yml
# Перед первым запуском: Settings → Pages → Source: GitHub Actions.

name: Pages

on:
  # Сборка при каждом пуше в ветку main
  push:
    branches: [main]
  # Ручной запуск из вкладки Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация; новая не отменяет начатую
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Сайт открывается с подпути /<имя-репозитория>/
      - run: npm run build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      # Обновление страницы на вкладке (/rso/sales) не даёт 404:
      # Pages отдаёт 404.html, а это то же приложение
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
